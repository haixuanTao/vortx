[package]
name = "vortx"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
description = "Cross-platform GPU tensor library with Rust."
repository = "https://github.com/dimforge/vortx"
version = { workspace = true }
edition = "2024"
license = "Apache-2.0"
exclude = ["assets/vortx-logo.png", "assets/vortx-logo2.png"]

[workspace]
members = [
    "vortx-shaders"
]
resolver = "2"

[features]
default = ["webgpu"]
webgpu = [ "khal/webgpu" ]
cpu = ["khal/cpu", "vortx-shaders/cpu"]
cpu-parallel = ["cpu", "vortx-shaders/cpu-parallel"]
cuda = ["khal/cuda", "khal-builder/cuda", "vortx-shaders/cuda"]
metal = ["khal/metal"]
push_constants = ["khal/push_constants", "vortx-shaders/push_constants"]
subgroup_ops = ["khal/subgroup_ops", "vortx-shaders/subgroup_ops"]

[workspace.package]
version = "0.2.0"

[workspace.dependencies]
khal-std = "0.2"
khal = { version = "0.2", features = ["derive"]}

[dependencies]
bytemuck = "1"
glamx = { version = "0.2", default-features = false, features = ["bytemuck"] }
include_dir = "0.7"
nalgebra = "0.35"
khal = { workspace = true }
khal-std = { workspace = true }
# Shader crate provides both GPU shader code and generated ShaderArgs via spirv_bindgen
vortx-shaders = { version = "0.2", path = "vortx-shaders" }

[dev-dependencies]
nalgebra = { version = "0.35", features = ["rand"] }
futures-test = "0.3"
serial_test = "3"
approx = "0.5"
async-std = { version = "1", features = ["attributes"] }
plotly = "0.12.1"
indexmap = "2"
anyhow = "1"
wgpu = "29"

[build-dependencies]
khal-builder = "0.2"
# To build the shader from the dependency instead of local path.
vortx-shaders = { version = "0.2", path = "./vortx-shaders" }

# Use the local khal 0.2 forks (forward-ported with the cuda-oxide feature) for
# the shader sub-build (vortx's build.rs invokes cargo-gpu in *this* workspace).
# The published khal-std 0.2 lacks the `cuda-oxide` feature that nexus-cuda's
# shader crates reference, so without these patches the shader build fails to
# resolve `khal-std/cuda-oxide`.
[patch.crates-io]
khal-builder = { path = "../khal-02port/crates/khal-builder" }
khal = { path = "../khal-02port/crates/khal" }
khal-std = { path = "../khal-02port/crates/khal-std" }
khal-derive = { path = "../khal-02port/crates/khal-derive" }
#glamx = { git = "https://github.com/dimforge/glamx", branch = "bytemuck" }
